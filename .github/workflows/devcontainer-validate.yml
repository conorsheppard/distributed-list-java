name: Validate Dev Container Config

on:
  push:
    paths:
      - '.devcontainer/**'
      - 'pom.xml'
      - 'src/**'
    branches: [ main ]
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'pom.xml'
      - 'src/**'
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Maven Action
      uses: s4u/setup-maven-action@v1.18.0
      with:
        java-version: '21'
        maven-version: '3.9.9'
    
    - name: Validate dev container config
      run: |
        # Check if devcontainer.json is valid JSON
        python3 -m json.tool .devcontainer/devcontainer.json
        
        # Check if referenced image exists
        echo "Dev container configuration is valid"
        
        # Validate Maven configuration
        mvn validate
        
        # Test compilation
        mvn clean compile
        
        echo "✅ Dev container configuration validation passed"
